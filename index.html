<div class="panel">
  <h2>Inscrire un élève</h2>
  <form id="studentForm">
    <div class="form-group">
      <label for="studentFirstName">Prénom</label>
      <input type="text" id="studentFirstName" required />
    </div>
    <div class="form-group">
      <label for="studentLastName">Nom</label>
      <input type="text" id="studentLastName" required />
    </div>
    <div class="form-group">
      <label for="studentBirthDate">Date de naissance</label>
      <input type="date" id="studentBirthDate" required />
    </div>
    <div class="form-group">
      <label for="studentClass">Classe</label>
      <select id="studentClass" required></select>
    </div>
    <div class="form-group">
      <label for="studentEmail">Adresse électronique</label>
      <input type="email" id="studentEmail" placeholder="exemple@email.com" required />
    </div>
    <button type="submit">Ajouter l'élève</button>
  </form>
</div>
