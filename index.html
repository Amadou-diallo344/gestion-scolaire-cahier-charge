<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Scolaire</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <h1>Gestion Scolaire</h1>
        <p>Suivi des élèves, classes et notes</p>
      </div>
    </header>

    <main class="container">
      <section class="dashboard">
        <div class="card stat-card">
          <span>Total classes</span>
          <strong id="totalClasses">0</strong>
        </div>
        <div class="card stat-card">
          <span>Total élèves</span>
          <strong id="totalStudents">0</strong>
        </div>
        <div class="card stat-card accent">
          <span>Moyenne générale</span>
          <strong id="averageScore">0.00</strong>
        </div>
      </section>

      <section class="grid-layout">
        <div class="panel">
          <h2>Ajouter une classe</h2>
          <form id="classForm">
            <div class="form-group">
              <label for="className">Nom de la classe</label>
              <input type="text" id="className" placeholder="Ex : 6ème A" required />
            </div>
            <div class="form-group">
              <label for="classLevel">Niveau</label>
              <input type="text" id="classLevel" placeholder="Ex : 6ème" required />
            </div>
            <button type="submit">Enregistrer</button>
          </form>
        </div>

        <div class="panel">
          <h2>Inscrire un élève</h2>
          <form id="studentForm">
            <div class="form-group">
              <label for="studentFirstName">Prénom</label>
              <input type="text" id="studentFirstName" required />
            </div>
            <div class="form-group">
              <label for="studentLastName">Nom</label>
              <input type="text" id="studentLastName" required />
            </div>
            <div class="form-group">
              <label for="studentBirthDate">Date de naissance</label>
              <input type="date" id="studentBirthDate" required />
            </div>
            <div class="form-group">
              <label for="studentClass">Classe</label>
              <select id="studentClass" required></select>
            </div>
            <button type="submit">Ajouter l’élève</button>
          </form>
        </div>

        <div class="panel wide-panel">
          <h2>Ajouter une note</h2>
          <form id="noteForm">
            <div class="form-row">
              <div class="form-group">
                <label for="noteStudent">Élève</label>
                <select id="noteStudent" required></select>
              </div>
              <div class="form-group">
                <label for="noteSubject">Matière</label>
                <input type="text" id="noteSubject" placeholder="Ex : Mathématiques" required />
              </div>
              <div class="form-group">
                <label for="noteType">Type</label>
                <select id="noteType" required>
                  <option value="Devoir">Devoir</option>
                  <option value="Contrôle">Contrôle</option>
                  <option value="Examen">Examen</option>
                </select>
              </div>
              <div class="form-group small-field">
                <label for="noteValue">Note</label>
                <input type="number" id="noteValue" min="0" max="20" step="0.1" required />
              </div>
            </div>
            <button type="submit">Enregistrer la note</button>
          </form>
        </div>
      </section>

      <section class="two-columns">
        <div class="panel">
          <h2>Classes</h2>
          <div id="classList" class="list-container"></div>
        </div>

        <div class="panel">
          <h2>Élèves</h2>
          <div id="studentList" class="list-container"></div>
        </div>
      </section>

      <section class="panel">
        <h2>Notes et moyennes</h2>
        <div id="notesTableContainer" class="table-container"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
